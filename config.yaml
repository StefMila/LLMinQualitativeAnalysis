# Unico punto di controllo del progetto: per un nuovo esperimento si cambiano i valori qui, non il codice.

seed: 42

# --- Dati ---------------------------------------------------------------
dati:
  excel: data/raw/risposte.xlsx   # Excel delle risposte (non si modifica mai)
                                  # dati sintetici per provare la pipeline: data/esempio/risposte_esempio.xlsx
  foglio: QL Coding               # contiene sia le risposte sia la codifica umana
  # Le colonne si indicano con la LETTERA di Excel; l'id di una risposta è il suo numero di riga.
  # col_umano = Coding 1, il riferimento. Le due colonne successive (Coding 2 e 3) sono codici
  # aggiuntivi della stessa codificatrice e non entrano nel confronto.
  # In Coding 1: "-" = non ancora codificata (riga esclusa), cella vuota = non classificabile.
  non_codificato: "-"

  domanda_attiva: piaciuto        # quale domanda analizzare: descrizione, piaciuto, non_piaciuto o diversamente
  domande:
    descrizione:
      testo_domanda: "Se dovessi descrivere in una frase quest'attività a un compagno, cosa diresti?"
      col_testo: AZ
      col_umano: BA
    piaciuto:
      testo_domanda: "Cosa ti è piaciuto di più?"
      col_testo: BD
      col_umano: BE
    non_piaciuto:
      testo_domanda: "Cosa invece non ti è piaciuto?"
      col_testo: BH
      col_umano: BJ
    diversamente:
      testo_domanda: "Cosa avresti voluto fare diversamente?"
      col_testo: BM
      col_umano: BN

split:
  n_serbatoio: 50       # risposte da cui si scelgono gli esempi one/few-shot e per la calibrazione
  n_valutazione: 300    # risposte su cui si misura l'accordo con l'umano; il resto va in resto.csv

# --- Codebook -----------------------------------------------------------
# I nomi devono coincidere ESATTAMENTE con quelli della codifica umana.
# Le definizioni vengono inserite nel prompt al posto di {codebook} in prompts/system.txt.
categorie:
  Social: "Enfasi sul lavorare insieme, confronto, condivisione, amicizia (es. gruppi, amici, gare tra compagni)."
  Making: "Enfasi sul processo, sul fare: fare, provare, sperimentare, costruire."
  Creativity: "Enfasi sul processo creativo: creare, inventare, progettare, ideare qualcosa di proprio. Non usarla per un 'creare' generico non collegato all'attività."
  Freedom: "Enfasi sulla libertà di scegliere: fare qualcosa liberamente, da soli, in autonomia, a propria scelta."
  Activity: "Enfasi sull'obiettivo o sul contenuto specifico dell'attività (es. programmare il gioco, creare un bot, la gara di corsa)."
  Tool: "Enfasi sull'oggetto, lo strumento o la tecnologia usata (es. micro:bit, microscopio, un software)."
  Time: "Enfasi sull'aspetto temporale (es. troppo poco tempo)."
  Learning: "Enfasi sul processo di apprendimento, sugli aspetti formativi, sull'aver imparato cose nuove."
  Teacher: "Enfasi sul formatore (docenti, prof, nomi dei formatori)."
  Flow: "Enfasi sul flusso dell'attività: spiegazioni, teoria, attese, momenti morti, organizzazione delle lezioni."
  Love: "Entusiasmo puro e indistinto per tutta l'esperienza (es. 'tutto' alla domanda su cosa è piaciuto; 'niente/nulla' alla domanda su cosa non è piaciuto o cosa cambiare)."
  Feeling+: "Enfasi sulle sensazioni personali positive (es. interessante, divertente, coinvolgente, bello)."
  Feeling-: "Enfasi sulle sensazioni personali negative (es. noioso, faticoso)."
  Hate: "Rifiuto puro e indistinto di tutta l'esperienza (es. 'niente' alla domanda su cosa è piaciuto; 'tutto' alla domanda su cosa non è piaciuto)."
  Competence: "Aspetto di competenza: attività percepita come troppo difficile o troppo facile, sentirsi capaci o incapaci."
  Usefulness: "Enfasi sull'utilità percepita per il futuro."
  hard fun: "Divertimento che porta ad apprendere: la risposta unisce il divertimento all'aver imparato qualcosa. Usala al posto di Feeling+ quando oltre al divertimento c'è un apprendimento."
non_classificabile: non classificabile   # risposte vuote, "non so", rumore, fuori tema

# --- Esperimento --------------------------------------------------------
# Un esperimento_id nuovo per ogni configurazione diversa (domanda, modelli, strategia, ragionamento...):
# separa i risultati in calls.jsonl e nelle metriche. Prova breve: python scripts/03_run.py --prova
esperimento_id: esempio_zero_shot
set_esecuzione: valutazione  # valutazione (n_valutazione risposte) o resto (verifica su risposte mai usate)
n_risposte: 300         # risposte del set da codificare (le prime n)
n_run: 10               # run ripetute per modello, strategia e risposta
temperatura: null       # null = default del modello (alcuni modelli di ragionamento non accettano 0)
max_tentativi: 3        # tentativi se l'output non è valido o l'API dà errore (429 esclusi)
max_tentativi_429: 8    # tentativi per quota superata (429): attesa Retry-After + jitter
n_thread: 8             # chiamate in parallelo; 1 = una alla volta
livello_ragionamento:   # low, medium o high; stesso nome per i due provider (le scale interne non coincidono)
  openai: medium
  anthropic: medium

cache:                  # true/false: prompt caching esplicita (cache_control); GPT usa comunque quella automatica
  anthropic: true
  openai: false

verifica_citazioni:
  versione_verifica: verifica_v2_tre_esiti
  soglia_somiglianza: 90             # sotto questo punteggio una citazione non è trovata
  soglie_sensibilita: [80, 85, 90, 95]
calibrazione_serbatoio: false  # true = 03_run.py codifica il serbatoio (solo zero-shot) invece della valutazione

modelli:
  - provider: openai      # openai, anthropic oppure mock (risposte casuali, senza API)
    nome: gpt-5.6-luna    # nome del deployment su Azure
  - provider: anthropic   # Claude su Azure AI Foundry
    nome: claude-haiku-5-5

strategie:              # zero_shot, one_shot e/o few_shot (una o più voci)
  - zero_shot

esempi:
  seed: 42              # ordine casuale delle risposte del serbatoio dentro ogni categoria (01b_esempi.py)
